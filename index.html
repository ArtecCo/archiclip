<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ArchiClip — Share Text Instantly</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="ArchiClip — Share Text Instantly" />
    <meta
      name="description"
      content="ArchiClip is a simple, fast, and temporary online clipboard for sharing text between devices. Paste text, create a link or QR code, and open it anywhere."
    />
    <meta
      name="keywords"
      content="ArchiClip, online clipboard, text sharing, temporary clipboard, share text, QR code, copy text, device to device"
    />
    <meta name="author" content="ArchiClip" />
    <meta name="robots" content="index, follow" />

    <!-- PWA / Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="ArchiClip" />
    <meta name="theme-color" content="#111111" />
    <meta name="application-name" content="ArchiClip" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ArchiClip" />
    <meta property="og:title" content="ArchiClip — Share Text Instantly" />
    <meta
      property="og:description"
      content="A simple, fast, and temporary online clipboard for sharing text between devices. Paste, create a link or QR code, and open it anywhere."
    />
    <!-- Add og:url and og:image when the production domain and OG image are ready. -->

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArchiClip — Share Text Instantly" />
    <meta
      name="twitter:description"
      content="A simple, fast, and temporary online clipboard for sharing text between devices."
    />
    <!-- Add twitter:image when the OG image is ready. -->

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/archiclip-logo.svg" />
    <link rel="apple-touch-icon" href="/archiclip-logo.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
